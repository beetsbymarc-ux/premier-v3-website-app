<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230">
  <!-- Chimney accent bar — gray, sits above left roof edge -->
  <rect x="76" y="6" width="28" height="10" rx="1" fill="#8C8C8C"/>

  <!-- Left house column / door surround (dark box) -->
  <rect x="76" y="16" width="46" height="92" rx="0" fill="#1C1C1C"/>
  <!-- Door opening cutout -->
  <rect x="92" y="48" width="30" height="60" rx="0" fill="#000000"/>

  <!-- Main roof chevron: thick blue V from left pillar top → peak → right -->
  <polyline points="76,16 240,108 404,16"
    fill="none" stroke="#4ABAEB" stroke-width="24"
    stroke-linejoin="miter" stroke-linecap="square"/>

  <!-- Right chimney: vertical stub above right end of roof -->
  <line x1="404" y1="16" x2="404" y2="0"
    stroke="#4ABAEB" stroke-width="24" stroke-linecap="square"/>

  <!-- PREMIER: gray, normal weight -->
  <text x="8" y="192"
    font-family="Arial,Helvetica,sans-serif"
    font-size="56" font-weight="400" letter-spacing="4"
    fill="#888888">PREMIER</text>

  <!-- REALTY: blue, bold -->
  <text x="284" y="192"
    font-family="Arial,Helvetica,sans-serif"
    font-size="56" font-weight="700" letter-spacing="4"
    fill="#4ABAEB">REALTY</text>
</svg>
