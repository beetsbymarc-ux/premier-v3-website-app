<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" role="img" aria-label="Premier Realty">

  <!-- Gray chimney cap -->
  <rect x="72" y="4" width="34" height="14" fill="#8A8A8A"/>

  <!-- Left column with transparent door opening (evenodd cutout) -->
  <path fill-rule="evenodd" fill="#1A1A1A"
    d="M72,18 L126,18 L126,118 L72,118 Z
       M94,50 L126,50 L126,118 L94,118 Z"/>

  <!-- Blue roof chevron -->
  <polyline
    points="72,18  260,118  448,18"
    fill="none"
    stroke="#4ABAEB"
    stroke-width="26"
    stroke-linejoin="miter"
    stroke-linecap="square"/>

  <!-- Right chimney vertical stub -->
  <line x1="448" y1="18" x2="448" y2="0"
    stroke="#4ABAEB" stroke-width="26" stroke-linecap="square"/>

  <!-- PREMIER — gray -->
  <text x="4" y="198"
    font-family="Arial,'Helvetica Neue',Helvetica,sans-serif"
    font-size="57" font-weight="400" letter-spacing="1"
    fill="#878787">PREMIER</text>

  <!-- REALTY — blue bold -->
  <text x="274" y="198"
    font-family="Arial,'Helvetica Neue',Helvetica,sans-serif"
    font-size="57" font-weight="700" letter-spacing="1"
    fill="#4ABAEB">REALTY</text>

</svg>
