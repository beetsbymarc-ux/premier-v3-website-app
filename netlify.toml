[build]
  publish = "."
  command = "echo 'No build needed'"

[[redirects]]
  from = "/"
  to = "/helen-wong-premier.html"
  status = 200

[[headers]]
  for = "/animated-site/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
